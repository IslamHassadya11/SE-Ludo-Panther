# ---------------------------------------------------------------- rules window (FR-07, FR-18); simple HTML allowed
rules.window=Panther Ludo - Rules
rules.title=GAME RULES
rules.forLevel=Rules of this game: {0} level
rules.dice.medium=<b>Medium:</b> two tracks (116 squares), step die + Boost die (1–3). Steps = step die × (Boost die − 1), so a 1 on the Boost die means no move. Inside your home lane only the step die counts.
rules.dice.hard=<b>Hard:</b> three tracks (188 squares), step die + UltraBoost die (1–6). Steps = step die × (UltraBoost die − 1), so a 1 on the UltraBoost die means no move. Inside your home lane only the step die counts.
rules.home.easy=When a panther reaches the arrow square in its own color, the arrow leads it into its colored home lane. Arrows of other colors are normal squares for it.
rules.question.titleShort=Question squares
rules.surprise.titleShort=Surprise squares
rules.pic.fourSteps== 4 steps
rules.squares=Squares on the board
rules.goal.title=Goal of the game
rules.goal.p1=Every player has four panthers that start in their castle. Move all four around the board and into the golden center before the others.
rules.goal.p2=When a player brings their fourth panther home, they get the next place in the ranking. The game ends when only one player is left; that player comes last.
rules.turns.title=Taking turns
rules.turns.p1=The first player is picked at random. After that, the turn passes clockwise around the board.
rules.turns.p2=Press <b>Roll Dice</b> (or the Space key) to roll. The top bar shows the game number, the game time and the round; the list on the side shows the turn order and how many panthers each player has brought home.
rules.dice.title=The dice and the boards
rules.dice.p1=<b>Easy:</b> one track of 52 squares and one step die (1–6). The number is how many squares you move.
rules.dice.p2=<b>Medium:</b> two tracks (116 squares), step die + Boost die (1–3). <b>Hard:</b> three tracks (188 squares), step die + UltraBoost die (1–6). Steps = step die × (other die − 1), so a 1 on the other die means no move. Inside your home lane only the step die counts.
rules.six.title=Rolling a 6
rules.six.p1=A 6 on the step die lets you bring a panther out of the castle onto your start square (#), or move a panther that is already on the board.
rules.six.p2=After a 6 you roll again, even if no panther could move. A third 6 in a row is cancelled.
rules.moving.title=Moving
rules.moving.p1=After rolling, the panthers that can move glow. Click one of them. You must use the whole roll with one panther; you cannot skip or split it.
rules.moving.p2=If there is only one possible move, the panther moves by itself. If no panther can move, a message explains why and the turn passes.
rules.capture.title=Capturing
rules.capture.p1=Land on a square where one opponent panther stands and it goes back to its castle. It needs a 6 to come out again.
rules.capture.p2=Nobody can be captured on a protected square (start #, star, surprise, home lane). Capturing does not give an extra roll.
rules.block.title=Double Block
rules.block.p1=Two or more of your panthers on the same square form a Double Block. Opponents cannot land on it or move past it, forwards or backwards. Your own panthers can.
rules.block.p2=If a block is in the way and no other panther can use the whole roll, the panther stops on the square right before the block.
rules.home.title=Arrows and going home
rules.home.p1=When a panther reaches the arrow square in its own color, it turns one track inward; on the inner track the arrow leads into its colored home lane. Arrows of other colors are normal squares for it.
rules.home.p2=To reach the center you need the exact number. A roll that is too big cannot be used by that panther; move another one instead.
rules.question.title=Question squares  (Medium and Hard)
rules.question.p1=Stop on a ? square and a question with four answers appears for everyone to see. Only the player whose turn it is answers; there is no time limit. The color of the square shows the difficulty: <b>green</b> easy, <b>yellow</b> medium, <b>red</b> hard.
rules.question.p2=Right answer: move forward 1, 2 or 3 squares (easy, medium or hard question). Wrong answer: move back the same number. The normal capture and block rules apply, and the new square can have its own effect.
rules.surprise.title=Surprise squares  (Medium and Hard)
rules.surprise.p1=Stop on a pink gift square and a random surprise happens:
rules.surprise.p2=&bull; 10% jump straight to the center<br>&bull; 10% move an opponent's panther back (half a step-die roll, rounded up)<br>&bull; 10% back to your castle<br>&bull; 30% move back 3 squares<br>&bull; 30% lose your next turn<br>&bull; 10% an extra roll with the UltraBoost die
rules.timer.title=Turn timer
rules.timer.p1=During your turn a countdown ring around your panther shows how much of your 60 seconds is left; it turns amber after 30 seconds and red in the last 10.
rules.timer.p2=When the time runs out, the computer plays the rest of that turn for you (press <b>Play Myself</b> to take it back). Your next turn starts with a full 60 seconds again. The timer stops while this Rules window or a question is open, and it can be switched off in Settings.
rules.legend.REGULAR=Normal square
rules.legend.REGULAR.meaning=Panthers can be captured here.
rules.legend.START=Start (#)
rules.legend.START.meaning=Where your panthers enter. Protected. In a corner nobody plays it is a normal square.
rules.legend.STAR=Star
rules.legend.STAR.meaning=Protected: no capturing here.
rules.legend.ARROW=Arrow
rules.legend.ARROW.meaning=Your color: turn inward / into your home lane.
rules.legend.HOME_LANE=Home lane
rules.legend.HOME_LANE.meaning=Only for its own color. Protected.
rules.legend.FINISH=Center
rules.legend.FINISH.meaning=The goal. Needs the exact number.
rules.legend.QUESTION=Question (?)
rules.legend.QUESTION.meaning=Answer to move forward. Medium/Hard.
rules.legend.SURPRISE=Surprise (gift)
rules.legend.SURPRISE.meaning=Random event. Protected. Medium/Hard.
