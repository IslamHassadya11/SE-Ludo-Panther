news.tagline1=Fast paws, faster answers. Never skips leg day.
news.tagline2=Loves a safe square and a good nap on it.
news.tagline3=Rolls sixes for breakfast. Ask anyone.
news.tagline4=Has read every question twice. Just in case.
news.tagline5=Chomps first, apologizes later.
news.tagline6=Sneaks home while everyone else argues.
news.didYouKnow=Did you know?
news.fact1=A 6 lets a panther leave its castle, and then you roll again. A third 6 in a row is cancelled!
news.fact2=Landing on an opponent sends that panther back to its castle. CHOMP!
news.fact3=Star squares are safe: no panther can be eaten there.
news.fact4=A right answer on a question square moves you forward; a wrong one moves you back.
news.fact5=Surprise squares can jump you to the finish, send you back to your castle or give you an extra roll.
news.fact6=If time runs out, the computer plays for you until you press Play Myself.
