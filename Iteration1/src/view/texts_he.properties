rules.dice.medium=<b>בינוני:</b> שני מסלולים (116 משבצות), קובייה רגילה + קוביית Boost (1–3). צעדים = קובייה רגילה × (קוביית Boost − 1), כך ש-1 בקוביית Boost פירושו בלי תזוזה. במסלול הבית נחשבת רק הקובייה הרגילה.
rules.dice.hard=<b>קשה:</b> שלושה מסלולים (188 משבצות), קובייה רגילה + קוביית UltraBoost (1–6). צעדים = קובייה רגילה × (קוביית UltraBoost − 1), כך ש-1 בקוביית UltraBoost פירושו בלי תזוזה. במסלול הבית נחשבת רק הקובייה הרגילה.
rules.home.easy=פנתר שמגיע למשבצת החץ בצבע שלו נכנס דרכה למסלול הבית הצבעוני שלו. חצים בצבעים אחרים הם משבצות רגילות בשבילו.
rules.question.titleShort=משבצות שאלה
rules.surprise.titleShort=משבצות הפתעה
rules.pic.fourSteps== 4 צעדים
rules.squares=המשבצות בלוח
rules.goal.title=מטרת המשחק
rules.goal.p1=לכל שחקן יש ארבעה פנתרים שמתחילים בטירה שלו. הובילו את כל הארבעה סביב הלוח אל המרכז המוזהב לפני האחרים.
rules.goal.p2=שחקן שמביא את הפנתר הרביעי הביתה מקבל את המקום הבא בדירוג. המשחק נגמר כשנשאר רק שחקן אחד; הוא במקום האחרון.
rules.turns.title=תורות
rules.turns.p1=השחקן הראשון נבחר באקראי. אחר כך התור עובר בכיוון השעון סביב הלוח.
rules.turns.p2=לחצו על <b>הטלת קוביות</b> (או על רווח) כדי להטיל. בשורה העליונה רואים את מספר המשחק, זמן המשחק והסיבוב; הרשימה בצד מראה את סדר התורות וכמה פנתרים כל שחקן הביא הביתה.
rules.dice.title=הקוביות והלוחות
rules.dice.p1=<b>קל:</b> מסלול אחד של 52 משבצות וקובייה רגילה אחת (1–6). המספר הוא מספר המשבצות שזזים.
rules.dice.p2=<b>בינוני:</b> שני מסלולים (116 משבצות), קובייה רגילה + קוביית Boost (1–3). <b>קשה:</b> שלושה מסלולים (188 משבצות), קובייה רגילה + קוביית UltraBoost (1–6). צעדים = קובייה רגילה × (הקובייה השנייה − 1), כך ש-1 בקובייה השנייה פירושו בלי תזוזה. במסלול הבית נחשבת רק הקובייה הרגילה.
rules.six.title=הטלת 6
rules.six.p1=6 בקובייה הרגילה מוציא פנתר מהטירה אל משבצת ההתחלה (#), או מזיז פנתר שכבר על הלוח.
rules.six.p2=אחרי 6 מטילים שוב, גם אם אף פנתר לא יכול היה לזוז. 6 שלישי ברצף מבוטל.
rules.moving.title=תזוזה
rules.moving.p1=אחרי ההטלה, הפנתרים שיכולים לזוז זוהרים. לחצו על אחד מהם. חייבים להשתמש בכל ההטלה עם פנתר אחד; אי אפשר לדלג או לפצל.
rules.moving.p2=אם יש רק מהלך אחד אפשרי, הפנתר זז לבד. אם אף פנתר לא יכול לזוז, הודעה מסבירה למה והתור עובר.
rules.capture.title=תפיסה
rules.capture.p1=נחתתם על משבצת שעומד בה פנתר יריב אחד? הוא חוזר לטירה שלו וצריך 6 כדי לצאת שוב.
rules.capture.p2=אי אפשר לתפוס על משבצת מוגנת (התחלה #, כוכב, הפתעה, מסלול בית). תפיסה לא נותנת הטלה נוספת.
rules.block.title=חסימה כפולה
rules.block.p1=שניים או יותר מהפנתרים שלכם על אותה משבצת יוצרים חסימה כפולה. יריבים לא יכולים לנחות עליה או לעבור אותה, קדימה או אחורה. הפנתרים שלכם יכולים.
rules.block.p2=אם חסימה בדרך ואף פנתר אחר לא יכול להשתמש בכל ההטלה, הפנתר עוצר במשבצת שלפני החסימה.
rules.home.title=חצים והדרך הביתה
rules.home.p1=פנתר שמגיע למשבצת החץ בצבע שלו פונה מסלול אחד פנימה; במסלול הפנימי החץ מוביל למסלול הבית הצבעוני שלו. חצים בצבעים אחרים הם משבצות רגילות בשבילו.
rules.home.p2=כדי להגיע למרכז צריך את המספר המדויק. הטלה גדולה מדי לא יכולה לשמש את הפנתר הזה; הזיזו פנתר אחר.
rules.question.title=משבצות שאלה  (בינוני וקשה)
rules.question.p1=עצרו על משבצת ? ותופיע שאלה עם ארבע תשובות שכולם רואים. רק השחקן שבתור עונה; אין הגבלת זמן. צבע המשבצת מראה את הקושי: <b>ירוק</b> קל, <b>צהוב</b> בינוני, <b>אדום</b> קשה.
rules.question.p2=תשובה נכונה: 1, 2 או 3 משבצות קדימה (שאלה קלה, בינונית או קשה). תשובה שגויה: אותו מספר אחורה. חוקי התפיסה והחסימה הרגילים חלים, ולמשבצת החדשה יכולה להיות השפעה משלה.
rules.surprise.title=משבצות הפתעה  (בינוני וקשה)
rules.surprise.p1=עצרו על משבצת המתנה הוורודה ותקרה הפתעה אקראית:
rules.surprise.p2=&bull; 10% קפיצה ישר למרכז<br>&bull; 10% החזרת פנתר של יריב (חצי מהטלת הקובייה, מעוגל למעלה)<br>&bull; 10% חזרה לטירה<br>&bull; 30% שלוש משבצות אחורה<br>&bull; 30% הפסד התור הבא<br>&bull; 10% הטלה נוספת עם קוביית UltraBoost
rules.timer.title=טיימר התור
rules.timer.p1=בזמן התור שלכם טבעת ספירה לאחור סביב הפנתר מראה כמה נשאר מ-60 השניות; היא הופכת לכתומה אחרי 30 שניות ולאדומה ב-10 האחרונות.
rules.timer.p2=כשהזמן נגמר, המחשב משחק במקומכם את שאר התור הזה (לחצו על <b>אני משחק</b> כדי לקחת אותו בחזרה). התור הבא שלכם מתחיל שוב עם 60 שניות מלאות. הטיימר עוצר כשחלון החוקים או שאלה פתוחים, ואפשר לכבות אותו בהגדרות.
rules.legend.REGULAR=משבצת רגילה
rules.legend.REGULAR.meaning=כאן אפשר לתפוס פנתרים.
rules.legend.START=התחלה (#)
rules.legend.START.meaning=כאן הפנתרים נכנסים. מוגנת. בפינה שאף אחד לא משחק בה זו משבצת רגילה.
rules.legend.STAR=כוכב
