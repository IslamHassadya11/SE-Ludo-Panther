rules.goal.p2=عندما يُوصل لاعب نمره الرابع إلى البيت يحصل على المركز التالي في الترتيب. تنتهي اللعبة عندما يبقى لاعب واحد فقط؛ ويكون الأخير.
rules.turns.title=الأدوار
rules.turns.p1=يُختار اللاعب الأول عشوائيًا. بعد ذلك ينتقل الدور باتجاه عقارب الساعة حول اللوحة.
rules.turns.p2=اضغط <b>ارمِ النرد</b> (أو مفتاح المسافة) للرمي. يُظهر الشريط العلوي رقم اللعبة ومدتها والجولة؛ وتُظهر القائمة الجانبية ترتيب الأدوار وعدد النمور التي أوصلها كل لاعب.
rules.dice.title=النرد واللوحات
rules.dice.p1=<b>سهل:</b> مسار واحد من 52 مربعًا ونرد خطوات واحد (1–6). الرقم هو عدد المربعات التي تتحركها.
rules.dice.p2=<b>متوسط:</b> مساران (116 مربعًا)، نرد الخطوات + نرد Boost (1–3). <b>صعب:</b> ثلاثة مسارات (188 مربعًا)، نرد الخطوات + نرد UltraBoost (1–6). الخطوات = نرد الخطوات × (النرد الآخر − 1)، لذلك 1 على النرد الآخر يعني لا حركة. في مسار البيت يُحسب نرد الخطوات فقط.
rules.six.title=رمي الرقم 6
rules.six.p1=الرقم 6 على نرد الخطوات يُخرج نمرًا من القلعة إلى مربع البداية (#)، أو يحرك نمرًا موجودًا على اللوحة.
rules.six.p2=بعد 6 ترمي مرة أخرى، حتى لو لم يستطع أي نمر التحرك. والرقم 6 للمرة الثالثة على التوالي يُلغى.
rules.moving.title=الحركة
rules.moving.p1=بعد الرمي تتوهج النمور التي يمكنها التحرك. انقر على أحدها. يجب استخدام الرمية كاملة مع نمر واحد؛ لا يمكن تخطيها أو تقسيمها.
rules.moving.p2=إذا كانت هناك حركة واحدة ممكنة، يتحرك النمر وحده. إذا لم يستطع أي نمر التحرك، تشرح رسالة السبب وينتقل الدور.
rules.capture.title=الأسر
rules.capture.p1=إذا هبطت على مربع فيه نمر واحد لخصم، يعود إلى قلعته ويحتاج إلى 6 للخروج مرة أخرى.
rules.capture.p2=لا يمكن أسر أحد على مربع محمي (البداية #، النجمة، المفاجأة، مسار البيت). الأسر لا يعطي رمية إضافية.
rules.block.title=الحاجز المزدوج
rules.block.p1=نمران أو أكثر من نمورك على المربع نفسه يشكّلان حاجزًا مزدوجًا. لا يستطيع الخصوم الهبوط عليه أو تجاوزه، إلى الأمام أو إلى الخلف. نمورك تستطيع.
rules.block.p2=إذا كان هناك حاجز في الطريق ولا يستطيع أي نمر آخر استخدام الرمية كاملة، يتوقف النمر في المربع الذي قبل الحاجز مباشرة.
rules.home.title=الأسهم والعودة إلى البيت
rules.home.p1=عندما يصل نمر إلى مربع السهم بلونه، ينعطف مسارًا واحدًا إلى الداخل؛ وفي المسار الداخلي يقوده السهم إلى مسار البيت الملوّن. أسهم الألوان الأخرى مربعات عادية بالنسبة له.
rules.home.p2=للوصول إلى المركز تحتاج إلى الرقم المضبوط. الرمية الكبيرة جدًا لا يمكن أن يستخدمها ذلك النمر؛ حرّك نمرًا آخر.
rules.question.title=مربعات الأسئلة  (متوسط وصعب)
rules.question.p1=توقف على مربع ? فيظهر سؤال بأربع إجابات يراه الجميع. يجيب فقط اللاعب صاحب الدور؛ بدون حد زمني. لون المربع يدل على الصعوبة: <b>أخضر</b> سهل، <b>أصفر</b> متوسط، <b>أحمر</b> صعب.
rules.question.p2=إجابة صحيحة: تقدّم 1 أو 2 أو 3 مربعات (سؤال سهل أو متوسط أو صعب). إجابة خاطئة: ارجع العدد نفسه. تنطبق قواعد الأسر والحاجز العادية، وقد يكون للمربع الجديد تأثيره الخاص.
rules.surprise.title=مربعات المفاجأة  (متوسط وصعب)
rules.surprise.p1=توقف على مربع الهدية الوردي فتحدث مفاجأة عشوائية:
rules.surprise.p2=&bull; 10% قفزة مباشرة إلى المركز<br>&bull; 10% إرجاع نمر لخصم (نصف رمية نرد الخطوات، مقربًا للأعلى)<br>&bull; 10% العودة إلى قلعتك<br>&bull; 30% الرجوع 3 مربعات<br>&bull; 30% خسارة دورك التالي<br>&bull; 10% رمية إضافية مع نرد UltraBoost
rules.timer.title=مؤقت الدور
rules.timer.p1=خلال دورك تُظهر حلقة العدّ التنازلي حول نمرك ما تبقى من الستين ثانية؛ تصبح برتقالية بعد 30 ثانية وحمراء في آخر 10 ثوانٍ.
rules.timer.p2=عندما ينتهي الوقت، يلعب الحاسوب بقية هذا الدور بدلًا منك (اضغط <b>سألعب بنفسي</b> لاستعادته). يبدأ دورك التالي بستين ثانية كاملة من جديد. يتوقف المؤقت عندما تكون نافذة القواعد أو سؤال مفتوحًا، ويمكن إيقافه من الإعدادات.
